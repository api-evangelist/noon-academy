aid: noon-academy
name: Noon Academy
description: Noon Academy (Noon) is a social learning platform where students study
  alongside their friends in live, teacher-led group classes. Operated by Noon Tech
  Limited and headquartered in Riyadh, Saudi Arabia, the company serves more than 12
  million students and over 100,000 teachers across five countries, primarily in the
  Middle East and South Asia. Noon is a consumer education product delivered through
  student and teacher apps and a web experience; it does not currently publish a public
  developer API, SDKs, or a developer portal. This API Evangelist profile was created
  from a 500 Global portfolio lead and enriched with the company's public identity
  and domain-security posture.
